name: frontend-deploy

on:
  push:
    branches: [ main ]

jobs:
  # ============================================================
  # ЭТАП 1: Сборка на раннере GitHub (у него достаточно памяти)
  # ============================================================
  build:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_URL: ${{ vars.VITE_BASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Build
        run: npm run build

      # Сохраняем результат сборки, чтобы передать во второй job
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 1

  # ============================================================
  # ЭТАП 2: Копирование готового dist на VPS
  # ============================================================
  deploy:
    needs: build                 # запускается только после успешной сборки
    runs-on: ubuntu-latest
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Copy dist to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: "dist/*"
          target: "${{ secrets.TARGET_DIR }}"
          strip_components: 1
          overwrite: true
          # Важно: scp-action не удаляет старые файлы,
          # поэтому очистку делаем отдельным шагом ниже

      - name: Fix ownership and reload web server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          command_timeout: 5m
          script: |
            set -e
            sudo chown -R "${{ secrets.WEB_USER }}:${{ secrets.WEB_GROUP }}" "${{ secrets.TARGET_DIR }}"
            echo "✅ Права на ${{ secrets.TARGET_DIR }} обновлены"
            # Если используете nginx — раскомментируйте:
            # sudo systemctl reload nginx